<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline | Factor Grid</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f7fb;
        color: #0f172a;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 16px;
        box-sizing: border-box;
      }
      main { max-width: 360px; text-align: center; }
      h1 { font-size: 1.25rem; margin: 0 0 8px; }
      p { color: #475569; font-size: 0.95rem; line-height: 1.5; margin: 0 0 20px; }
      button {
        font: inherit;
        font-weight: 600;
        padding: 10px 18px;
        border-radius: 10px;
        border: 0;
        background: #0369a1;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Factor Grid needs a connection to load and save registry data. Reconnect and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
