<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
  </defs>

  <!-- Icon Mark: Interlocking Data Grid & Human Factor Nodes -->
  <g transform="translate(5, 5)">
    <!-- Background Squircle Card -->
    <rect width="50" height="50" rx="12" fill="#0F172A" />
    
    <!-- Matrix Grid Dots -->
    <circle cx="17" cy="17" r="2" fill="#64748B" />
    <circle cx="33" cy="17" r="2" fill="#64748B" />
    <circle cx="17" cy="33" r="2" fill="#64748B" />
    <circle cx="33" cy="33" r="2" fill="#64748B" />

    <!-- Active Connected Factor Nodes -->
    <circle cx="17" cy="25" r="3.5" fill="#0EA5E9" />
    <circle cx="33" cy="17" r="3" fill="#14B8A6" />
    <circle cx="25" cy="33" r="3" fill="#14B8A6" />
    
    <!-- Precision Connecting Paths -->
    <path d="M17 25 L33 17 M17 25 L25 33" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Typography: Enterprise Wordmark -->
  <text x="68" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F172A" letter-spacing="-0.5">
    Factor<tspan fill="#0EA5E9">Grid</tspan>
  </text>
  <text x="69" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#64748B" letter-spacing="2">
    HUMAN FACTOR ANALYTICS
  </text>
</svg>
